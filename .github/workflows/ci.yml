name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3']

    name: PHP ${{ matrix.php-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli, mbstring, json, curl, gd, zip
          coverage: none

      - name: Verify PHP extensions
        run: |
          php -m | grep -i mysqli
          php -m | grep -i mbstring

      - name: Lint PHP files
        run: |
          find application system modules helpers -name '*.php' -print0 \
            | xargs -0 -n1 php -l
